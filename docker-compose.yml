services:
  db:
    image: postgres:16-alpine
    container_name: agrolead-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrolead}
      POSTGRES_USER: ${POSTGRES_USER:-agrolead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-agrolead} -d ${POSTGRES_DB:-agrolead}",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 768m
    cpus: 0.35
    networks:
      - agrolead

  api:
    build:
      context: ./backend
    container_name: agrolead-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TZ: ${TZ:-Europe/Moscow}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:?ADMIN_PASS is required}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ALLOW_STATIC_ADMIN_TOKEN: ${ALLOW_STATIC_ADMIN_TOKEN:-0}
      ADMIN_SESSION_TTL_MINUTES: ${ADMIN_SESSION_TTL_MINUTES:-720}
      RESET_ADMIN_PASSWORD_ON_STARTUP: ${RESET_ADMIN_PASSWORD_ON_STARTUP:-0}
      SALES_STYLE: ${SALES_STYLE:-kuban-direct}
      TOXIC_STRICT_MODE: ${TOXIC_STRICT_MODE:-1}

      LLM_PROVIDER: ${LLM_PROVIDER:-gigachat}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-5}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_REWRITE_ENABLED: ${LLM_REWRITE_ENABLED:-1}

      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_AUTH_URL: ${GIGACHAT_AUTH_URL:-https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      GIGACHAT_API_BASE_URL: ${GIGACHAT_API_BASE_URL:-https://gigachat.devices.sberbank.ru/api/v1}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2}
      GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-1}
      GIGACHAT_CA_FILE: ${GIGACHAT_CA_FILE:-}
      GIGACHAT_INSECURE_SSL_FALLBACK: ${GIGACHAT_INSECURE_SSL_FALLBACK:-0}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-https://artemshtodin.ru/api/integrations/telegram/webhook}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    cpus: 0.55
    networks:
      - agrolead

  webui:
    build:
      context: ./web
    image: agrolead/webui:local
    container_name: agrolead-webui
    restart: unless-stopped
    environment:
      TLS_DOMAIN: ${DOMAIN_NAME:-artemshtodin.ru}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.10
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot:ro
    networks:
      - agrolead

  certbot:
    image: certbot/certbot:latest
    container_name: agrolead-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh
    command: >
      -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    networks:
      - agrolead

volumes:
  app_data:
  pg_data:
  letsencrypt:
  certbot_www:

networks:
  agrolead:
    driver: bridge
